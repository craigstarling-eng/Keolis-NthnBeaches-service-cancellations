name: Shark Watch collect

on:
  schedule:
    - cron: "*/15 * * * *"   # live sources (SA, NSW, WA)
    - cron: "17 16 * * *"    # historical (QLD SCP, ASID) ~3:17am Sydney
  workflow_dispatch:
    inputs:
      group:
        description: "live | historical | all"
        default: "all"
      backfill:
        description: "Pull SA yearly archives too (1 = yes)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: sharkwatch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sharkwatch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Pick group
        id: g
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "group=${{ inputs.group }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "17 16 * * *" ]; then
            echo "group=historical" >> $GITHUB_OUTPUT
          else
            echo "group=live" >> $GITHUB_OUTPUT
          fi

      - name: Run collectors
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: python collectors/run.py ${{ steps.g.outputs.group }}

      - name: Commit data
        run: |
          git config user.name "sharkwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -q -m "sharkwatch data: ${{ steps.g.outputs.group }}"
            for i in 1 2 3; do
              git pull -q --rebase -X theirs && git push -q && break
              sleep 10
            done
          fi
