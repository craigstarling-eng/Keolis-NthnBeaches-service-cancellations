name: collect
# Each run keeps checking the live feed every 5 minutes for about 5 hours,
# then starts the next run itself. The hourly schedule is only a backup.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore working cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: tfnsw-${{ github.run_id }}
          restore-keys: tfnsw-
      - run: pip install requests gtfs-realtime-bindings pillow cryptography
      - name: Collect every 5 minutes
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          git config user.name tracker-bot
          git config user.email actions@users.noreply.github.com
          publish() {
            git add -A data
            if ! git diff --cached --quiet; then
              git commit -q -m "update data"
              git pull -q --rebase -X theirs || true
              git push -q || echo "push failed, will retry next time"
            fi
          }
          end=$(( $(date +%s) + 310*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python collector.py || echo "collector reported a problem"
            python tools/post_social.py auto || echo "social posting reported a problem"
            python tools/telegram_bot.py alerts || echo "telegram alerts reported a problem"
            publish
            # Answer Telegram messages every 30 seconds until the next data update.
            for i in 1 2 3 4 5 6 7 8 9; do
              sleep 30
              python tools/telegram_bot.py replies || true
            done
            publish
          done
      - name: Save working cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: tfnsw-${{ github.run_id }}
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only chain if this run lasted a while, so a broken run can't loop rapidly.
          if [ $(( $(date +%s) - ${STARTED_AT:-0} )) -gt 1800 ]; then
            gh workflow run collect.yml --ref main -R "${{ github.repository }}"
          else
            echo "Run ended early; not starting another automatically."
          fi
