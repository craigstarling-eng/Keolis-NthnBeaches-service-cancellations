name: collect
# Each run keeps checking the live feed every 5 minutes for about 5 hours.
# The hourly schedule queues the next run so there is no gap.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore working cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: tfnsw-${{ github.run_id }}
          restore-keys: tfnsw-
      - run: pip install requests gtfs-realtime-bindings
      - name: Collect every 5 minutes
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
        run: |
          git config user.name tracker-bot
          git config user.email actions@users.noreply.github.com
          end=$(( $(date +%s) + 310*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python collector.py || echo "collector reported a problem"
            git add -A data
            if ! git diff --cached --quiet; then
              git commit -q -m "update data"
              git pull -q --rebase -X theirs || true
              git push -q || echo "push failed, will retry next time"
            fi
            sleep 300
          done
      - name: Save working cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: tfnsw-${{ github.run_id }}
