name: collect
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore working cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: tfnsw-${{ github.run_id }}
          restore-keys: tfnsw-
      - run: pip install requests gtfs-realtime-bindings
      - run: python collector.py
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
      - name: Save working cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: tfnsw-${{ github.run_id }}
      - name: Publish data
        if: always()
        run: |
          git config user.name tracker-bot
          git config user.email actions@users.noreply.github.com
          git add -A data
          git diff --cached --quiet || (git commit -m "update data" && git pull --rebase && git push)
