name: incidentwatch-collect
# Sydney Incident Watch: pulls police, fire and road incidents every 15 minutes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency: { group: incidentwatch, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: incidentwatch } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Collect
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
        run: python scripts/collect.py
      - name: Commit data
        run: |
          git config user.name "incidentwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "incidentwatch data" -q
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep $((i*5)); done
