name: official-data
# Downloads Transport for NSW's official monthly bus performance spreadsheets.
on:
  schedule:
    - cron: "17 3 5 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_official.py
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
      - run: |
          git config user.name tracker-bot
          git config user.email actions@users.noreply.github.com
          git add -A data/official
          git diff --cached --quiet || (git commit -m "official data" && git pull --rebase && git push)
